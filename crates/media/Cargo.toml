# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "octosnap-media"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
futures-channel = { version = "0.3", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Reading a GIF back for the editor (`gif_edit`): exact frames, delays and disposal,
# which gdk-pixbuf's animation iterator cannot report (it loops without saying where).
# Already in the lockfile as gifski's own dependency.
gif = "0.13"
gifski = { version = "1.34", default-features = false }
gio = "0.22"
glib = "0.22"
gst = { package = "gstreamer", version = "0.25" }
gst-app = { package = "gstreamer-app", version = "0.25" }
gst-video = { package = "gstreamer-video", version = "0.25" }
imgref = "1"
octosnap-core = { version = "0.1.0", path = "../core" }
# A recording's frames are kept as PNGs until a GIF is asked for (`reel`, D113): lossless,
# and the fast deflate keeps a full-size frame in a few milliseconds. Already the app's.
png = "0.18.1"
rgb = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
# The reel's `recording.json`. Already the app's and the core's.
serde_json = "1.0.151"
thiserror = "2.0.20"
tracing = "0.1.44"
