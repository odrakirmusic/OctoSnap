<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!--
    SPDX-License-Identifier: CC-BY-SA-4.0
    OctoSnap's application icon: an octopus holding the picture it is taking by the
    selection's two lower handles (D141). Drawn on GNOME's 128 px app-icon grid, with the
    landscape card and its lip from the earlier icon (D121), and colours from the GNOME
    palette.
  -->
  <defs>
    <linearGradient id="sky" x1="0" y1="14" x2="0" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#62a0ea"/>
      <stop offset="1" stop-color="#99c1f1"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="58" x2="0" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#dc8add"/>
      <stop offset="1" stop-color="#c061cb"/>
    </linearGradient>
    <linearGradient id="arm" x1="0" y1="80" x2="0" y2="124" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c061cb"/>
      <stop offset="1" stop-color="#9141ac"/>
    </linearGradient>
    <clipPath id="picture">
      <rect x="15" y="15" width="98" height="62" rx="6"/>
    </clipPath>
  </defs>

  <!-- The picture being taken: its card, the photo on it, and the selection's handles. -->
  <rect x="9" y="15" width="110" height="74" rx="11" fill="#c0bfbc"/>
  <rect x="9" y="9" width="110" height="74" rx="11" fill="#f6f5f4"/>
  <g clip-path="url(#picture)">
    <rect x="15" y="15" width="98" height="62" fill="url(#sky)"/>
    <circle cx="34" cy="32" r="7" fill="#f6d32d"/>
    <path d="M15 62 C30 52 44 50 60 57 C74 63 92 60 113 53 L113 77 L15 77 Z" fill="#ffffff"/>
    <path d="M15 70 C34 64 58 66 80 71 C92 74 104 73 113 69 L113 77 L15 77 Z" fill="#deddda"/>
  </g>

  <!-- The octopus, holding the frame's two lower handles. -->
  <ellipse cx="64" cy="121" rx="30" ry="3.5" fill="#000000" fill-opacity="0.16"/>
  <path d="M42 98 C30 100 20 96 14 86" fill="none" stroke="url(#arm)" stroke-width="9" stroke-linecap="round"/>
  <path d="M86 98 C98 100 108 96 114 86" fill="none" stroke="url(#arm)" stroke-width="9" stroke-linecap="round"/>
  <circle cx="30" cy="101" r="1.6" fill="#f3c1f5"/>
  <circle cx="22" cy="97" r="1.4" fill="#f3c1f5"/>
  <circle cx="98" cy="101" r="1.6" fill="#f3c1f5"/>
  <circle cx="106" cy="97" r="1.4" fill="#f3c1f5"/>
  <path d="M44 104 C40 112 36 116 30 117" fill="none" stroke="#9141ac" stroke-width="8" stroke-linecap="round"/>
  <path d="M84 104 C88 112 92 116 98 117" fill="none" stroke="#9141ac" stroke-width="8" stroke-linecap="round"/>
  <path d="M54 108 C53 114 50 118 46 119" fill="none" stroke="#a347ba" stroke-width="8" stroke-linecap="round"/>
  <path d="M74 108 C75 114 78 118 82 119" fill="none" stroke="#a347ba" stroke-width="8" stroke-linecap="round"/>
  <path d="M64 56 C82 56 93 70 93 88 C93 104 82 113 64 113 C46 113 35 104 35 88 C35 70 46 56 64 56 Z" fill="url(#skin)"/>
  <ellipse cx="55" cy="64" rx="8" ry="4" fill="#ffffff" fill-opacity="0.35" transform="rotate(-20 55 64)"/>
  <ellipse cx="53" cy="88" rx="5.5" ry="6.5" fill="#241f31"/>
  <ellipse cx="75" cy="88" rx="5.5" ry="6.5" fill="#241f31"/>
  <circle cx="51" cy="85.5" r="2.2" fill="#ffffff"/>
  <circle cx="73" cy="85.5" r="2.2" fill="#ffffff"/>
  <circle cx="55.5" cy="91" r="1" fill="#ffffff"/>
  <circle cx="77.5" cy="91" r="1" fill="#ffffff"/>
  <ellipse cx="45" cy="98" rx="4.5" ry="2.6" fill="#f66151" fill-opacity="0.45"/>
  <ellipse cx="83" cy="98" rx="4.5" ry="2.6" fill="#f66151" fill-opacity="0.45"/>
  <path d="M60 98 C62 100.5 66 100.5 68 98" fill="none" stroke="#613583" stroke-width="2" stroke-linecap="round"/>

  <circle cx="14" cy="84" r="6" fill="#ffffff" stroke="#3584e4" stroke-width="3"/>
  <circle cx="114" cy="84" r="6" fill="#ffffff" stroke="#3584e4" stroke-width="3"/>
</svg>
